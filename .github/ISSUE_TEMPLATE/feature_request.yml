name: Feature request
description: Something the SDK should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the SDK currently makes hard or impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: What would calling it look like? A sketch is enough.
      render: php

  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds considered
      description: How do you solve this today, if at all?
